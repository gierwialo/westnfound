server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The calendar lives on this domain now. /kalendarz and /calendar are a
    # page a person can read; the .ics addresses next to them are the feed a
    # calendar app subscribes to, which only Django can build - it has to know
    # which city the Host header names. All four page spellings are exact
    # matches on purpose: the regex location further down would otherwise
    # catch /kalendarz/ and send it to Django's admin panel.
    location = /kalendarz {
        try_files /calendar.html =404;
    }
    location = /kalendarz/ {
        try_files /calendar.html =404;
    }
    location = /calendar {
        try_files /calendar.html =404;
    }
    location = /calendar/ {
        try_files /calendar.html =404;
    }

    # The page's own file name is not one of its addresses - it is reachable
    # through the four paths above and nowhere else.
    location = /calendar.html {
        return 404;
    }

    location = /kalendarz.ics {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /calendar.ics {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt and the sitemap are built by Django, because both depend on
    # which city the Host header names. Without these two locations they would
    # fall through to the catch-all below and answer with index.html - a whole
    # HTML page, status 200, which is what they did until now.
    location = /robots.txt {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to backend (production mode with Gunicorn)
    location /api/ {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Production timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Django static files (CSS, JS, fonts) - served directly by nginx
    # Using ^~ to prevent regex locations from matching
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django admin panel - configurable URL via DJANGO_ADMIN_URL
    # Matches any path with alphanumeric/underscore/dash that's NOT /api/, /static/, /health
    # This will handle /dnkrozz/, /admin/, /secret-panel/, etc.
    # Negative lookahead to exclude /api and /static
    location ~ ^/(?!api/|static/|health)[a-zA-Z0-9_-]+/ {
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Production timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend files - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
