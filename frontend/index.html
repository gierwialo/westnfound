        <div x-show="unknownCity && !loading" x-cloak class="card empty">
            <div class="em"><svg class="i"><use href="#i-map"/></svg></div>
            <h3 x-text="t('unknownCityTitle')"></h3>
            <p x-text="t('unknownCityBody')"></p>
            <div class="chips" x-show="cities.length">
                <template x-for="city in cities" :key="city.slug">
                    <a class="chip" :href="city.url" x-text="city.name"></a>
                </template>
            </div>
            <a class="btn tonal" href="https://app.gdzienawesta.com/add-your-city.html"><svg class="i"><use href="#i-plus"/></svg><span x-text="t('addYourCity')"></span></a>
        </div>

        <!-- Error -->
        <div x-show="error && !loading" x-cloak class="card empty">
            <div class="em warn-ic"><svg class="i"><use href="#i-alert"/></svg></div>
            <h3 x-text="t('loadFailed')"></h3>
            <p x-text="t('errorHint')"></p>
            <button type="button" class="btn primary" @click="loadEvent()"><svg class="i"><use href="#i-refresh"/></svg><span x-text="t('retryButton')"></span></button>
        </div>

        <!-- A city with nothing planned -->
        <div x-show="showEmpty" x-cloak>
            <div class="card empty">
                <div class="em"><svg class="i"><use href="#i-cal"/></svg></div>
                <h3 x-text="t('emptyTitle')"></h3>
                <p x-text="t('emptyBody')"></p>
                <button type="button" class="btn primary" x-show="cities.length > 1" @click="openSheet('city', $event)" aria-haspopup="dialog"><span x-text="t('changeCity')"></span></button>
                <button type="button" class="btn tonal" @click="loadEvent()"><svg class="i"><use href="#i-refresh"/></svg><span x-text="t('refresh')"></span></button>
            </div>
            <p class="under"><span x-text="t('keeperPrompt')"></span> <a href="https://app.gdzienawesta.com/add-your-city.html" x-text="t('keeperLink')"></a></p>
        </div>

        <!-- The next event, and the two after it -->
        <main class="cols" x-show="showEvents" x-cloak>
            <article class="card hero">
                <div class="hero-top">
                    <span class="badge" x-text="badge"></span>
                    <button type="button" class="icon-btn" @click="share(event)" :aria-label="t('share')" :title="t('share')">
                        <svg class="i" x-show="!shared"><use href="#i-share"/></svg>
                        <svg class="i" x-show="shared" x-cloak><use href="#i-check"/></svg>
                    </button>
                    <span class="sr-only" role="status" x-text="shared ? t('calendarCopied') : ''"></span>
                </div>
                <h2 x-text="event?.title"></h2>
                <div class="info">
                    <div class="ic"><svg class="i"><use href="#i-clock"/></svg></div>
                    <div><b x-text="dayLine(event?.start)"></b><span x-text="timeRange(event)"></span></div>
                </div>
                <div class="info" x-show="event?.location">
                    <div class="ic"><svg class="i"><use href="#i-pin"/></svg></div>
                    <div><b x-text="where.place"></b><span x-show="where.streetWithCity" x-text="where.streetWithCity"></span></div>
                </div>
                <button type="button" class="btn primary" @click="addToCalendar(event)"><svg class="i"><use href="#i-calplus"/></svg><span x-text="t('actionCalendar')"></span></button>
                <div class="actions">
                    <button type="button" class="btn tonal" x-show="event?.location" @click="openNavigation(event)"><svg class="i"><use href="#i-nav"/></svg><span x-text="t('actionDirections')"></span></button>
                    <button type="button" class="btn tonal" @click="openDetails(event, $event)" aria-haspopup="dialog"><svg class="i"><use href="#i-info"/></svg><span x-text="t('actionDetails')"></span></button>
                </div>
            </article>

            <section x-show="events.length > 1">
                <h2 class="label-grad" x-text="t('later')"></h2>
                <template x-for="next in events.slice(1)" :key="next.start + next.title">
                    <button type="button" class="card mini" @click="openDetails(next, $event)" aria-haspopup="dialog">
                        <div class="tile"><small x-text="shortWeekday(next.start)"></small><strong x-text="dayOfMonth(next.start)"></strong></div>
                        <div class="tt"><b x-text="next.title"></b><span x-text="[timeOfDay(next.start), placeOf(next.location)].filter(Boolean).join(' · ')"></span></div>
                        <span class="chev"><svg class="i"><use href="#i-chev-r"/></svg></span>
                    </button>
                </template>
                <a class="see-all" :href="'/' + t('calendarPath')"><span x-text="t('fullCalendar')"></span><svg class="i"><use href="#i-chev-r"/></svg></a>
            </section>
        </main>

        <footer class="foot">
            <div class="cities" x-show="cities.length > 1">
                <span class="flab" x-text="t('footerCities')"></span>
                <template x-for="(city, index) in cities" :key="city.slug">
                    <span><a :href="city.url" :class="{ on: city.is_current }" x-text="city.name"></a><span x-show="index < cities.length - 1"> &middot; </span></span>
                </template>
            </div>
            <div class="links">
                <a :href="'/' + t('calendarPath')" x-text="t('footerCalendarDirect')"></a> &middot;
                <a href="https://app.gdzienawesta.com" target="_blank" rel="noopener" x-text="t('footerApp')"></a> &middot;
                <a href="https://app.gdzienawesta.com/add-your-city.html" target="_blank" rel="noopener" x-text="t('addYourCity')"></a> &middot;
                <a href="https://app.gdzienawesta.com/thanks.html" target="_blank" rel="noopener" x-text="t('footerThanks')"></a> &middot;
                <a href="https://app.gdzienawesta.com/support.html" target="_blank" rel="noopener" x-text="t('footerSupport')"></a>
            </div>
            <!-- Project plumbing: real, but not what a dancer came here for -->
            <div class="fine">
                <span class="love" x-text="t('footerLove')"></span> &middot;
                <span x-text="t('footerCode')"></span> <a href="https://github.com/gierwialo/westnfound" target="_blank" rel="noopener">GitHub</a> &middot;
                <span x-text="t('footerFeedback')"></span> <a href="https://github.com/gierwialo/westnfound/issues" target="_blank" rel="noopener" x-text="t('footerReport')"></a><br>
                <span x-text="t('timezone')"></span>
            </div>
        </footer>

        <!-- Sheets: from the bottom on a phone, a window on a wide screen. One
             layer for both; `sheet` says which one is open. -->
        <div class="sheet-layer" x-show="sheet" x-cloak
             @keydown.escape.window="closeSheet()"
             @keydown.tab="trapFocus($event)">
            <button type="button" class="dim" tabindex="-1" @click="closeSheet()" :aria-label="t('close')"></button>

            <!-- Event details -->
            <template x-if="sheet === 'details' && detail">
                <div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="details-title" x-ref="sheetBox" tabindex="-1">
                    <div class="grab" aria-hidden="true"></div>
                    <div class="sheet-top">
                        <div>
                            <span class="badge" x-text="badgeFor(detail)"></span>
                            <h2 id="details-title" x-text="detail.title"></h2>
                        </div>
                        <button type="button" class="close-x" @click="closeSheet()" :aria-label="t('close')"><svg class="i"><use href="#i-x"/></svg></button>
                    </div>

                    <div class="group top-gap">
                        <div class="drow">
                            <div class="ic"><svg class="i"><use href="#i-clock"/></svg></div>
                            <div class="tt"><b x-text="dayLine(detail.start)"></b><span x-text="timeRange(detail)"></span></div>
                        </div>
                        <div class="drow" x-show="detail.location">
                            <div class="ic"><svg class="i"><use href="#i-pin"/></svg></div>
                            <div class="tt"><b x-text="whereOf(detail).place"></b><span x-show="whereOf(detail).streetWithCity" x-text="whereOf(detail).streetWithCity"></span></div>
                            <button type="button" class="tbtn" @click="openNavigation(detail)" x-text="t('actionDirections')"></button>
                        </div>
                    </div>

                    <button type="button" class="btn primary" @click="addToCalendar(detail)"><svg class="i"><use href="#i-calplus"/></svg><span x-text="t('actionCalendar')"></span></button>

                    <div class="sub-h" x-show="description.text || description.facebook" x-text="t('description')"></div>
                    <div class="group" :class="{ 'top-gap': !(description.text || description.facebook) }">
                        <!-- The calendar's text goes in as text nodes and nothing else: the
                             only links are the http(s) ones GnwModel.linkify finds. A part
                             without a url is an <a> with no href, which is plain text.
                             Keep the <p> on one line: its white-space keeps line breaks. -->
                        <template x-if="description.text"><p class="desc"><template x-for="(part, index) in description.parts" :key="index"><a :href="part.url" :target="part.url ? '_blank' : null" :rel="part.url ? 'noopener noreferrer' : null" x-text="part.text"></a></template></p></template>
                        <a class="linkrow" x-show="description.facebook" :href="description.facebook?.url" target="_blank" rel="noopener noreferrer">
                            <div class="fb" aria-hidden="true">f</div>
                            <div class="tt"><b x-text="t('facebookEvent')"></b></div>
                            <span class="chev"><svg class="i"><use href="#i-ext"/></svg></span>
                        </a>
                        <a class="linkrow" :href="correctionHref(detail)">
                            <div class="sq"><svg class="i"><use href="#i-flag"/></svg></div>
                            <div class="tt"><b x-text="t('correctionTitle')"></b><span x-text="t('correctionHint')"></span></div>
                        </a>
                    </div>
                </div>
            </template>

            <!-- City -->
            <template x-if="sheet === 'city'">
                <div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="city-title" x-ref="sheetBox" tabindex="-1">
                    <div class="grab" aria-hidden="true"></div>
                    <h2 id="city-title" x-text="t('cityTitle')"></h2>
                    <p class="lead2" x-text="t('cityHint')"></p>
                    <div class="group">
                        <template x-for="city in cities" :key="city.slug">
                            <a class="opt" :href="city.url" :aria-current="city.is_current ? 'true' : null">
                                <span x-text="city.name"></span><span class="radio" :class="{ on: city.is_current }" aria-hidden="true"></span>
                            </a>
                        </template>
                    </div>
                    <a class="addrow" href="https://app.gdzienawesta.com/add-your-city.html"><svg class="i"><use href="#i-plus"/></svg><span x-text="t('addYourCity')"></span></a>
                </div>
            </template>
        </div>
    </div>

    <script src="translations.js?v=a655ae4e"></script>
    <script src="sheets.js?v=0155d224"></script>
    <script src="model.js?v=8c3f1b49"></script>
    <script src="app.js?v=5162a14f"></script>
<!-- slot:body-end -->
</body>
</html>
