<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gdzie na Westa? - Najbliższe Wydarzenie</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="styles.css?v=9db47249">
</head>
<body>
    <div class="container" x-data="eventApp()" x-init="init()">
        <!-- Header -->
        <header class="header">
            <div class="language-switcher language-switcher-desktop">
                <button @click="setLanguage('pl')" :class="{ active: currentLang === 'pl' }" class="lang-btn">PL</button>
                <button @click="setLanguage('en')" :class="{ active: currentLang === 'en' }" class="lang-btn">EN</button>
            </div>
            <h1 x-text="t('title')"></h1>
            <p class="subtitle">
                <span x-text="t('subtitle')"></span><template x-if="namedCity"><span> &middot; <span class="city-current" x-text="namedCity.name"></span></span></template>
            </p>
        </header>

        <!-- Loading State -->
        <div x-show="loading" class="loading">
            <div class="spinner"></div>
            <p x-text="t('loading')"></p>
        </div>

        <!-- Unknown City State -->
        <div x-show="unknownCity && !loading" class="error-card">
            <div class="language-switcher language-switcher-mobile">
                <button @click="setLanguage('pl')" :class="{ active: currentLang === 'pl' }" class="lang-btn">PL</button>
                <button @click="setLanguage('en')" :class="{ active: currentLang === 'en' }" class="lang-btn">EN</button>
            </div>
            <div class="error-icon">🗺️</div>
            <h2 x-text="t('unknownCityTitle')"></h2>
            <p x-text="t('unknownCityBody')"></p>
            <p class="city-list" x-show="cities.length">
                <template x-for="(city, index) in cities" :key="city.slug">
                    <span>
                        <a :href="city.url" x-text="city.name"></a><span x-show="index < cities.length - 1"> · </span>
                    </span>
                </template>
            </p>
            <p class="city-add">
                <a href="https://app.gdzienawesta.com/add-your-city.html" x-text="t('addYourCity')"></a>
            </p>
        </div>

        <!-- Error State -->
        <div x-show="error && !loading" class="error-card">
            <div class="error-icon">⚠️</div>
            <h2 x-text="t('errorTitle')"></h2>
            <p x-text="errorMessage"></p>
            <button @click="loadEvent()" class="retry-btn" x-text="t('retryButton')"></button>
        </div>

        <!-- Event Card -->
        <div x-show="event && !loading && !error && !unknownCity" class="event-card">
            <div class="language-switcher language-switcher-mobile">
                <button @click="setLanguage('pl')" :class="{ active: currentLang === 'pl' }" class="lang-btn">PL</button>
                <button @click="setLanguage('en')" :class="{ active: currentLang === 'en' }" class="lang-btn">EN</button>
            </div>

            <!-- Event Navigation -->
            <div x-show="events.length > 1" class="event-navigation">
                <button x-show="hasPreviousEvent()" @click="previousEvent()" class="nav-btn nav-prev" aria-label="Previous event">
                    ‹
                </button>
                <button x-show="hasNextEvent()" @click="nextEvent()" class="nav-btn nav-next" aria-label="Next event">
                    ›
                </button>
            </div>

            <div class="event-header">
                <div class="event-icon">🎵</div>
                <h2 x-text="event?.title" class="event-title"></h2>
            </div>

            <div class="event-details">
                <!-- Date & Time -->
                <div class="detail-item">
                    <div class="detail-icon">📅</div>
                    <div class="detail-content">
                        <div class="detail-label" x-text="t('dateTimeLabel')"></div>
                        <div class="detail-value-row">
                            <span class="detail-value" x-text="formatDate(event?.start)"></span>
                            <button @click="addToCalendar()" class="action-btn" x-text="t('addToCalendar')"></button>
                        </div>
                    </div>
                </div>

                <!-- Location -->
                <div x-show="event?.location" class="detail-item">
                    <div class="detail-icon">📍</div>
                    <div class="detail-content">
                        <div class="detail-label" x-text="t('locationLabel')"></div>
                        <div class="detail-value-row">
                            <span class="detail-value" x-text="event?.location"></span>
                            <button @click="openNavigation()" class="action-btn" x-text="t('navigate')"></button>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div x-show="event?.description" class="detail-item description">
                    <div class="detail-icon">📝</div>
                    <div class="detail-content">
                        <div class="detail-label" x-text="t('descriptionLabel')"></div>
                        <div class="detail-value" x-html="formatDescription(event?.description)"></div>
                    </div>
                </div>
            </div>

            <!-- Countdown -->
            <div class="countdown">
                <div class="countdown-label" x-show="!isEventOngoing()" x-text="t('countdownPrefix')"></div>
                <div class="countdown-value" x-text="getTimeUntil()"></div>
            </div>

            <!-- Event Counter -->
            <div x-show="events.length > 1" class="event-counter">
                <span x-text="currentEventIndex + 1"></span> / <span x-text="events.length"></span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer-love" x-text="t('footerLove')"></p>

            <!-- Cities first: what the visitor might actually want next -->
            <p class="footer-cities" x-show="cities.length > 1">
                <span x-text="t('footerCities')"></span>
                <template x-for="(city, index) in cities" :key="city.slug">
                    <span>
                        <a :href="city.url" :class="{ 'city-current': city.is_current }" x-text="city.name"></a><span x-show="index < cities.length - 1"> &middot; </span>
                    </span>
                </template>
            </p>

            <p class="footer-links">
                <a :href="'/' + t('calendarPath')" x-text="t('footerCalendarDirect')"></a> &middot;
                <a href="https://app.gdzienawesta.com" target="_blank" rel="noopener" x-text="t('footerApp')"></a> &middot;
                <a href="https://app.gdzienawesta.com/add-your-city.html" target="_blank" rel="noopener" x-text="t('addYourCity')"></a> &middot;
                <a href="https://app.gdzienawesta.com/thanks.html" target="_blank" rel="noopener" x-text="t('footerThanks')"></a>
            </p>

            <!-- Project plumbing: real, but not what a dancer came here for -->
            <div class="footer-fineprint">
                <p class="footer-links">
                    <span x-text="t('footerCode')"></span> <a href="https://github.com/gierwialo/westnfound" target="_blank" rel="noopener">GitHub</a> &middot;
                    <span x-text="t('footerFeedback')"></span> <a href="https://github.com/gierwialo/westnfound/issues" target="_blank" rel="noopener" x-text="t('footerReport')"></a>
                </p>
                <p class="footer-timezone" x-text="t('timezone')"></p>
            </div>
        </footer>
    </div>

    <script src="translations.js?v=63498f5e"></script>
    <script src="app.js?v=3fb3e000"></script>
</body>
</html>
